parameters:
  app.articles_file: "%kernel.project_dir%/var/data/articles.json"
services:
  _defaults:
    autowire: true
    autoconfigure: true
  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"
  App\Controller\:
    resource: "../src/Controller/"
    tags: ["controller.service_arguments"]
  App\Repository\ArticleRepository:
    arguments:
      $articlesFile: "%app.articles_file%"
